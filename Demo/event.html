<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event · Bamberg Security</title>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="summits">

<main id="event"></main>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  const e = BS.byId(id) || BS.upcoming()[0];
  const isPast = new Date(e.date) < BS.today;
  document.title = `${e.title} · Bamberg Security`;

  const ico = {
    cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    lock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    pin: BS.icons.pin.replace(/14/g, '18'),
    mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
  };

  const speakerRow = sp => `
    <div class="ag-speaker"><span class="avatar sm">SN</span><div><strong>${sp.name}</strong><small>${sp.org}</small></div></div>`;

  const agendaBlock = b => `
    <div class="ag-block">
      <div class="ag-head">
        <div>
          <h3 class="heading">${b.title}</h3>
          <span class="data">${b.from} - ${b.to}</span> (local time)
        </div>
        ${b.sessions.length ? `<span class="ag-pill label">${b.sessions.length} session${b.sessions.length > 1 ? 's' : ''}</span>` : ''}
      </div>
      ${b.sessions.map(s => `
        <div class="ag-session">
          <h4 class="heading">${s.title}</h4>
          <p class="ag-when"><span class="data">${BS.fmtDate(e.date)}</span> · <span class="data">${s.from} - ${s.to}</span> (local time)</p>
          <div class="ag-speakers">${s.speakers.map(speakerRow).join('')}</div>
        </div>`).join('')}
    </div>`;

  const v = e.venue;

  document.getElementById('event').innerHTML = `
  <section class="event-hero on-dark" style="background-image:url('${e.image}')">
    <div class="wrap">
      <span class="label">${isPast ? 'Past event' : 'Cybersecurity & Digital Trust Summit Series'}</span>
      <h1 class="display">${e.title}</h1>
      <div class="event-facts">
        <div>${ico.cal}<span class="data">${BS.fmtDate(e.date)}</span></div>
        <div>${ico.clock}<span class="data">${e.time}</span>&nbsp;(local time)</div>
        <div>${ico.pin}${e.city}, ${e.country}</div>
        <div>${ico.lock}${e.access} · ${e.format}</div>
      </div>
      <div class="row">
        ${isPast
          ? `<a class="btn btn-coral" href="photos.html">View photos</a>`
          : `<a class="btn btn-coral" href="#register">Register</a>`}
        <a class="btn btn-ghost" href="#agenda">Explore agenda</a>
      </div>
    </div>
  </section>

  <nav class="subnav" aria-label="Event sections">
    <div class="wrap">
      <a href="#overview">Overview</a>
      <a href="#speakers">Speakers</a>
      <a href="#agenda">Agenda</a>
      <a href="#partners">Partners</a>
      <a href="#venue">Venue</a>
      <a href="#voices">Testimonials</a>
      <a href="#register">${isPast ? 'Next events' : 'Register'}</a>
    </div>
  </nav>

  <section class="ev-section" id="overview">
    <div class="wrap overview">
      <div>
        <span class="label">Overview</span>
        <h2 class="heading">About the summit</h2>
        <p>${e.short}</p>
        <p>The ${e.title} is part of the Bamberg Cybersecurity &amp; Digital Trust Summit Series, bringing together senior cybersecurity, technology, risk, data and government leaders for focused discussions on the most important challenges shaping cybersecurity and digital trust.</p>
        <h3 class="heading" style="font-size:1.15rem; margin:32px 0 14px">Key topics</h3>
        <div class="chips">${e.topics.map(t => `<span class="chip">${t}</span>`).join('')}</div>
      </div>
      <aside class="facts-card">
        <dl>
          <div><dt>Date</dt><dd class="data">${BS.fmtDate(e.date)}</dd></div>
          <div><dt>Time</dt><dd><span class="data">${e.time}</span> (local time)</dd></div>
          <div><dt>Location</dt><dd>${e.city}, ${e.country}</dd></div>
          <div><dt>Format</dt><dd>${e.format}</dd></div>
          <div><dt>Access</dt><dd>${e.access} — by invitation</dd></div>
          <div><dt>Speakers</dt><dd class="data">${e.speakers}</dd></div>
        </dl>
      </aside>
    </div>
  </section>

  <section class="ev-section alt" id="speakers">
    <div class="wrap">
      <span class="label">Speakers</span>
      <h2 class="heading">${e.speakers} senior leaders</h2>
      <div class="speaker-grid">
        ${Array.from({ length: 8 }, () => `
          <div class="speaker-card"><span class="avatar">SN</span><strong>Speaker name</strong><small>Role</small><small>Organization</small></div>`).join('')}
      </div>
    </div>
  </section>

  <section class="ev-section" id="agenda">
    <div class="wrap">
      <span class="label">Agenda</span>
      <h2 class="heading">Programme</h2>
      <p class="ag-note">Sessions are published as speakers are confirmed.</p>
      <div class="agenda-blocks">${BS.agenda.map(agendaBlock).join('')}</div>
    </div>
  </section>

  <section class="ev-section alt" id="partners">
    <div class="wrap">
      <div class="center-head">
        <span class="label">Our partners</span>
        <h2 class="heading">Join us in creating private spaces for strategic dialogue and real-world insights</h2>
      </div>
      ${BS.sponsorsByCategory().map(g => `
        <div class="sponsor-tier">
          <p class="tier-name label">${g.cat}</p>
          <div class="sponsor-row">
            ${g.items.map(s => `<div class="sponsor"><img src="${s.logo}" alt="${s.name}" loading="lazy"${s.dim ? ` style="--b:${s.dim}"` : ''}></div>`).join('')}
          </div>
        </div>`).join('')}
      <div class="row" style="justify-content:center; display:flex; margin-top:36px">
        <a class="btn btn-purple" href="#" data-open-inquiry>Become a partner</a>
      </div>
    </div>
  </section>

  <section class="ev-section" id="venue">
    <div class="wrap">
      <span class="label">Venue</span>
      <h2 class="heading">${v.name}</h2>
      <div class="venue-card">
        <div class="venue-media">
          ${v.photo
            ? `<img src="${v.photo}" alt="${v.name}">`
            : `<div class="venue-empty">${ico.pin}<span>Photo to be confirmed</span></div>`}
        </div>
        <div class="venue-info">
          <div class="venue-line">${ico.pin}<div><strong>Address</strong><p>${v.address}</p></div></div>
          <div class="venue-line">${ico.mail}<div><strong>Contact</strong><p><a href="mailto:${v.email}">${v.email}</a></p></div></div>
          ${v.map ? `<a class="btn btn-outline" href="${v.map}" target="_blank" rel="noopener">Open in maps</a>` : ''}
          <p class="venue-note">The exact room and access details are shared with confirmed attendees.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="testimonials alt" id="voices">
    <div class="wrap">
      <div class="center-head">
        <span class="label">Voices</span>
        <h2 class="heading">What participants say</h2>
      </div>
      <div class="t-carousel">
        <button class="t-nav prev" type="button" aria-label="Previous testimonials">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="t-track" id="ev-testimonials"></div>
        <button class="t-nav next" type="button" aria-label="Next testimonials">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  ${isPast ? `
  <section class="cta-band" id="register">
    <h2 class="heading">This event has already taken place</h2>
    <p>Check out the upcoming summits of the Bamberg Cybersecurity &amp; Digital Trust Summit Series.</p>
    <div class="row"><a class="btn btn-purple" href="summits.html">Upcoming events</a><a class="btn btn-outline" href="photos.html">View photos</a></div>
  </section>` : `
  <section class="register on-dark" id="register">
    <div class="wrap">
      <div class="center-head on-dark">
        <span class="label">Registration</span>
        <h2 class="heading">Get your place</h2>
      </div>

      <div class="reg-panel">
        <!-- Paso 1: el correo es la llave. Si el usuario existe, se loguea; si no, lo crea -->
        <div class="reg-step" id="step-email">
          <h3 class="heading">Start with your work email</h3>
          <p>We use your email to check whether you already have a Bamberg account.</p>
          <form class="reg-mail">
            <input type="email" required placeholder="name@company.com" aria-label="Work email">
            <button class="btn btn-purple" type="submit">Continue</button>
          </form>
          <p class="reg-hint" hidden></p>
        </div>

        <!-- Paso 2: invitación gratuita y/o compra de entrada -->
        <div class="reg-step" id="step-options" hidden>
          <div class="invite-box">
            <div>
              <h3 class="heading">Request your free invitation</h3>
              <p><strong>ONLY FOR:</strong> senior decision-makers from public institutions, regulatory bodies and critical sectors, including CISOs, CIOs, CTOs and leaders in data governance and compliance across finance, insurance, energy, infrastructure, telecommunications, logistics, healthcare, manufacturing and utilities.</p>
            </div>
            <button class="btn btn-coral" type="button" id="btn-invite">Request invitation</button>
          </div>

          <div class="tickets">
            ${BS.tickets.map((t, i) => `
              <div class="ticket">
                <div>
                  <strong>${t.name}</strong> <span class="ticket-tag label">${t.mode}</span>
                  <p class="ticket-exp">This ticket expires on: <span class="data">${t.expires}</span></p>
                </div>
                <div class="ticket-buy">
                  <span class="ticket-price">Price: <b class="data">${t.price} ${t.currency}</b></span>
                  <div class="qty" data-price="${t.price}">
                    <button type="button" aria-label="Less">−</button>
                    <span class="data" id="q${i}">0</span>
                    <button type="button" aria-label="More">+</button>
                  </div>
                </div>
              </div>`).join('')}
            <p class="ticket-note">Registration is transferable to colleagues or to future events, though it is not refundable.</p>
            <div class="checkout">
              <span>Total: <b class="data" id="total">0 USD</b></span>
              <button class="btn btn-purple" type="button" id="btn-pay" disabled>Checkout with Stripe</button>
            </div>
          </div>
        </div>

        <!-- Resultado -->
        <div class="reg-step" id="step-done" hidden>
          <h3 class="heading" id="done-title">Request received</h3>
          <p id="done-text">Our team reviews every request to keep the conversation among senior decision-makers. We will reply by email.</p>
          <a class="btn btn-outline" href="summits.html">Back to summits</a>
        </div>
      </div>
    </div>
  </section>`}`;

  // Testimonios del evento
  const evT = document.getElementById('ev-testimonials');
  if (evT) {
    evT.innerHTML = BS.testimonials.map(BS.testimonialCard).join('');
    BS.initCarousel(document.querySelector('#voices .t-carousel'));
  }

  // Registro: el correo decide si hay que crear cuenta o iniciar sesión
  const stepEmail = document.getElementById('step-email');
  if (stepEmail) {
    const hint = stepEmail.querySelector('.reg-hint');
    const options = document.getElementById('step-options');
    const done = document.getElementById('step-done');

    stepEmail.querySelector('form').addEventListener('submit', ev => {
      ev.preventDefault();
      const mail = stepEmail.querySelector('input').value.trim();
      const existe = /@bambergsummits\\.com$/i.test(mail); // en Bubble: búsqueda real del usuario
      hint.hidden = false;
      hint.textContent = existe
        ? `Account found for ${mail} — log in to continue.`
        : `No account for ${mail} yet — we will create one for you.`;
      options.hidden = false;
      options.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('btn-invite').addEventListener('click', () => {
      options.hidden = true;
      done.hidden = false;
      done.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Contador de entradas
    const qty = document.querySelector('.qty');
    const total = document.getElementById('total');
    const pay = document.getElementById('btn-pay');
    let n = 0;
    qty.addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      n = Math.max(0, n + (b.textContent === '+' ? 1 : -1));
      qty.querySelector('span').textContent = n;
      total.textContent = `${n * Number(qty.dataset.price)} USD`;
      pay.disabled = n === 0;
    });
    pay.addEventListener('click', () => {
      options.hidden = true;
      document.getElementById('done-title').textContent = 'Redirecting to Stripe';
      document.getElementById('done-text').textContent = '(Demo) In the real site this opens the Stripe checkout for your tickets.';
      done.hidden = false;
      done.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
