<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team · Bamberg Security</title>
  <meta name="description" content="The team behind Bamberg Security.">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="team">

<main>

<section class="page-hero flat on-dark">
  <div class="wrap">
    <span class="label">About us</span>
    <h1 class="display">Our team</h1>
    <p>The people behind every Bamberg Security summit, roundtable and executive meeting. Talk to us directly.</p>
  </div>
</section>

<section class="team">
  <div class="wrap">
    <div class="team-grid" id="team"></div>
  </div>
</section>

<section class="cta-band">
  <h2 class="heading">Want to take part?</h2>
  <p>Whether you would like to attend, speak or collaborate with us, our team is one message away.</p>
  <div class="row">
    <a class="btn btn-coral" href="#" data-open-inquiry>Explore opportunities</a>
    <a class="btn btn-outline" href="summits.html">View upcoming summits</a>
  </div>
</section>

</main>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  const inSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.4 2H3.6C2.7 2 2 2.7 2 3.6v16.8c0 .9.7 1.6 1.6 1.6h16.8c.9 0 1.6-.7 1.6-1.6V3.6c0-.9-.7-1.6-1.6-1.6zM8 19H5V9.5h3zM6.5 8.2a1.7 1.7 0 1 1 0-3.5 1.7 1.7 0 0 1 0 3.5zM19 19h-3v-4.6c0-1.1 0-2.5-1.5-2.5S12.7 13 12.7 14.3V19h-3V9.5h2.8v1.3c.4-.8 1.4-1.5 2.9-1.5 3 0 3.6 2 3.6 4.6z"/></svg>';
  const waSvg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2zm5.6 14.2c-.2.7-1.3 1.3-1.9 1.3-.5 0-1.1.2-3.6-.8-3-1.3-5-4.4-5.1-4.6-.2-.2-1.3-1.7-1.3-3.2s.8-2.3 1.1-2.6c.3-.3.6-.4.8-.4h.6c.2 0 .5 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.4 1.8 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l.9-1c.2-.2.4-.2.6-.1l2.1 1c.3.1.5.2.5.4z"/></svg>';
  document.getElementById('team').innerHTML = BS.team.map(m => `
    <article class="member">
      <div class="member-photo"><img src="${m.photo}" alt="${m.name}" loading="lazy"></div>
      <div class="member-body">
        <h3 class="heading">${m.name}</h3>
        <span class="role">${m.role}</span>
        <a class="mail" href="mailto:${m.email}">${m.email}</a>
        <div class="member-links">
          <a href="#" aria-label="LinkedIn">${inSvg}</a>
          <a href="#" aria-label="WhatsApp">${waSvg}</a>
        </div>
      </div>
    </article>`).join('');
</script>
</body>
</html>
